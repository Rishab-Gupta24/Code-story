[project]
name = "code-story"
version = "0.1.0"
description = "MCP server that lets a coding assistant log focused, reviewable explanations of its changes to .ai-code-log.md."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "filelock>=3.12",
    "mcp>=2.3,<3",
]

[project.scripts]
code-story = "code_story.server:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_story"]

[tool.pytest.ini_options]
testpaths = ["tests"]
