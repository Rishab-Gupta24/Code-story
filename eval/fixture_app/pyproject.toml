[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fixture-app"
version = "0.1.0"
description = "Evaluation fixture checkout and inventory service for Code Story"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
